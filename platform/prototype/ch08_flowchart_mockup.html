<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What_Want · 第八章 — 全书可视化流程图（决策导航原型）</title>
<style>
  :root{
    --paper:#f6efde;
    --paper-light:#faf4e3;
    --paper-edge:#ebe1c8;
    --ink:#2a2620;
    --ink-soft:#6b6354;
    --ink-faint:#9c937f;
    --accent:#7a4d2b;       /* 赭石：书卷气主色 */
    --accent-soft:#d8c4a3;
    --accent-bg:#f1e8d2;
    --green:#4d6b3f;
    --blue:#6b7f9f;
    --rule:#d9cfb6;
    --shadow-sm:0 1px 3px rgba(42,38,32,.10);
    --shadow-md:0 4px 14px rgba(42,38,32,.14);
    --serif:"Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",serif;
    --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--serif);color:var(--ink);background-color:var(--paper);
    background-image:radial-gradient(circle at 18% 12%, rgba(255,255,255,.55), transparent 42%),
                     radial-gradient(circle at 82% 78%, rgba(216,196,163,.28), transparent 46%);
    background-attachment:fixed;min-height:100vh;line-height:1.7;-webkit-font-smoothing:antialiased;
  }

  /* ---------- Top bar ---------- */
  .top-bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;padding:12px 24px;
    background:var(--paper-light);border-bottom:1px solid var(--paper-edge);box-shadow:var(--shadow-sm);font-family:var(--sans);}
  .top-bar .chap-info{display:flex;flex-direction:column;line-height:1.3;min-width:200px;}
  .top-bar .chap-info .k{font-size:11px;color:var(--ink-faint);letter-spacing:.04em;}
  .top-bar .chap-info .v{font-size:15px;color:var(--accent);font-weight:600;}
  .top-bar .progress-wrap{flex:1;display:flex;align-items:center;gap:10px;}
  .progress-track{flex:1;height:6px;border-radius:99px;background:var(--paper-edge);overflow:hidden;max-width:420px;}
  .progress-fill{height:100%;width:0%;background:var(--accent);border-radius:99px;transition:width .35s ease;}
  .progress-label{font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .save-flag{font-family:var(--sans);font-size:12px;color:var(--green);background:rgba(77,107,63,.10);
    border:1px solid rgba(77,107,63,.3);border-radius:99px;padding:4px 12px;white-space:nowrap;opacity:0;transition:.2s;}
  .save-flag.show{opacity:1;}

  /* ---------- Soft prompt banner ---------- */
  .soft-prompt{font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);background:var(--accent-bg);
    border-bottom:1px solid var(--accent-soft);padding:9px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .soft-prompt .sp-lbl{color:var(--accent);font-weight:600;}
  .soft-prompt .sp-chip{background:var(--paper-light);border:1px solid var(--paper-edge);border-radius:99px;
    padding:3px 11px;cursor:pointer;transition:.16s;}
  .soft-prompt .sp-chip:hover{border-color:var(--accent-soft);color:var(--accent);}
  .soft-prompt .sp-close{margin-left:auto;cursor:pointer;color:var(--ink-faint);border:none;background:none;font-size:16px;line-height:1;}

  /* ---------- Layout ---------- */
  .layout{display:grid;grid-template-columns:minmax(380px,0.92fr) 1.08fr;gap:22px;max-width:1240px;margin:0 auto;padding:22px 24px 70px;}
  @media (max-width:980px){.layout{grid-template-columns:1fr;}}

  /* ---------- Left: full flowchart ---------- */
  .flow-wrap{font-family:var(--sans);}
  .flow-title{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 14px;}
  .flow-title h2{font-family:var(--serif);font-size:17px;margin:0;color:var(--ink);}
  .flow-title .legend{font-size:11px;color:var(--ink-faint);display:flex;gap:12px;}
  .flow-title .legend i{font-style:normal;display:inline-flex;align-items:center;gap:4px;}
  .dot-cur{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;}
  .dot-vis{width:9px;height:9px;border-radius:50%;background:var(--accent-soft);display:inline-block;}
  .dot-fut{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--paper-edge);display:inline-block;}

  .stage-head{font-size:12.5px;color:var(--accent);font-weight:600;letter-spacing:.03em;margin:18px 4px 8px;
    padding-left:9px;border-left:3px solid var(--accent-soft);}
  .fc-node{background:var(--paper-light);border:1px solid var(--paper-edge);border-radius:6px;padding:10px 12px;
    cursor:pointer;transition:.18s;box-shadow:var(--shadow-sm);}
  .fc-node:hover{border-color:var(--accent-soft);}
  .fc-node.visited{background:#fffdf7;}
  .fc-node.current{border-color:var(--accent);box-shadow:0 0 0 2px rgba(122,77,43,.18);}
  .fc-node-head{display:flex;align-items:flex-start;gap:9px;}
  .fc-dp-num{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--accent-soft);color:var(--accent);
    font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;background:var(--paper-light);margin-top:1px;}
  .fc-node.visited .fc-dp-num{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent);}
  .fc-node.visited .fc-dp-num::after{content:"✓";}
  .fc-node.current .fc-dp-num{background:var(--accent);border-color:var(--accent);color:#fff;}
  .fc-node.current .fc-dp-num::after{content:"";}
  .fc-q{font-family:var(--serif);font-size:14px;color:var(--ink);line-height:1.45;font-weight:500;}
  .fc-branches{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0 31px;}
  .fc-branch{font-size:11px;color:var(--ink-faint);background:var(--paper);border:1px solid var(--paper-edge);
    border-radius:99px;padding:2px 9px;transition:.16s;}
  .fc-branch.chosen{background:var(--accent-bg);border-color:var(--accent-soft);color:var(--accent);font-weight:600;}
  .fc-branch.chosen.jump{background:rgba(107,127,159,.14);border-color:rgba(107,127,159,.4);color:var(--blue);}
  .fc-connector{height:16px;width:2px;background:var(--accent-soft);margin:5px auto 5px 21px;border-radius:2px;}
  .fc-connector.stage-gap{background:linear-gradient(var(--accent-soft),var(--paper-edge));}
  .fc-end{margin-top:6px;background:var(--accent);color:#fff;border-radius:6px;padding:13px 14px;text-align:center;
    box-shadow:var(--shadow-md);}
  .fc-end .e-lbl{font-size:11px;opacity:.8;letter-spacing:.08em;}
  .fc-end .e-msg{font-family:var(--serif);font-size:14.5px;margin-top:3px;}

  /* ---------- Right: questionnaire ---------- */
  .quiz{background:var(--paper-light);border:1px solid var(--paper-edge);border-radius:8px;box-shadow:var(--shadow-md);
    overflow:hidden;position:sticky;top:78px;align-self:start;}
  .quiz-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--paper-edge);
    background:var(--paper);font-family:var(--sans);}
  .quiz-head .qh-left{display:flex;flex-direction:column;line-height:1.35;}
  .quiz-head .qh-k{font-size:11px;color:var(--accent);letter-spacing:.05em;}
  .quiz-head .qh-t{font-size:14px;color:var(--ink);font-weight:600;}
  .quiz-head .qh-step{font-size:11px;color:var(--ink-faint);}
  .quiz-body{padding:18px 18px 20px;}

  .q-stage-tag{display:inline-block;font-family:var(--sans);font-size:11px;color:var(--accent);background:var(--accent-bg);
    border:1px solid var(--accent-soft);border-radius:99px;padding:3px 11px;margin-bottom:12px;}
  .q-question{font-family:var(--serif);font-size:19px;line-height:1.5;color:var(--ink);margin:0 0 4px;font-weight:600;}
  .q-sub{font-family:var(--sans);font-size:12px;color:var(--ink-faint);margin:0 0 16px;}

  .branch-grid{display:flex;flex-direction:column;gap:9px;margin-bottom:6px;}
  .branch-btn{font-family:var(--sans);font-size:14px;text-align:left;background:#fffdf7;border:1px solid var(--paper-edge);
    border-radius:6px;padding:11px 14px;cursor:pointer;transition:.16s;color:var(--ink);display:flex;align-items:center;
    justify-content:space-between;gap:10px;}
  .branch-btn:hover{border-color:var(--accent-soft);background:var(--accent-bg);}
  .branch-btn.sel{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:600;}
  .branch-btn .bb-tag{font-size:11px;color:var(--ink-faint);white-space:nowrap;}
  .branch-btn.sel .bb-tag{color:var(--accent);}
  .branch-btn.jump .bb-tag{color:var(--blue);}

  .hint-callout{font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);background:var(--accent-bg);
    border:1px dashed var(--accent-soft);border-radius:6px;padding:11px 13px;margin:12px 0;line-height:1.65;}
  .hint-callout .hc-lbl{display:block;font-size:10.5px;color:var(--accent);letter-spacing:.04em;margin-bottom:4px;}

  .jump-cta{font-family:var(--sans);background:#fffdf7;border:1px solid rgba(107,127,159,.4);border-left:3px solid var(--blue);
    border-radius:0 6px 6px 0;padding:13px 14px;margin:12px 0;}
  .jump-cta .jc-chap{font-size:12px;color:var(--blue);font-weight:600;margin-bottom:3px;}
  .jump-cta .jc-hint{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:9px;}
  .jump-cta .jc-qk{display:inline-block;font-size:11px;background:rgba(107,127,159,.12);color:var(--blue);
    border-radius:99px;padding:2px 9px;margin-bottom:9px;}
  .jump-btn{font-family:var(--sans);font-size:13px;border-radius:4px;cursor:pointer;padding:8px 14px;transition:.16s;
    border:1px solid var(--blue);background:var(--blue);color:#fff;}
  .jump-btn:hover{filter:brightness(1.06);}

  .comment-box{margin-top:16px;}
  .comment-box label{font-family:var(--sans);font-size:12px;color:var(--ink-soft);display:block;margin-bottom:6px;}
  .comment-box label .saved-at{color:var(--green);font-size:11px;margin-left:6px;}
  textarea{width:100%;font-family:var(--sans);font-size:13px;color:var(--ink);background:#fffdf7;
    border:1px solid var(--paper-edge);border-radius:6px;padding:10px 12px;resize:vertical;min-height:74px;line-height:1.6;}
  textarea:focus{outline:none;border-color:var(--accent-soft);}

  .save-row{display:flex;align-items:center;gap:10px;margin-top:14px;}
  .btn{font-family:var(--sans);font-size:13px;border-radius:4px;cursor:pointer;padding:9px 16px;transition:.18s;
    border:1px solid var(--accent);background:var(--accent);color:#fff;}
  .btn:hover{filter:brightness(1.06);}
  .btn.ghost{background:var(--paper-light);color:var(--accent);border:1px solid var(--accent-soft);}
  .btn.ghost:hover{background:var(--accent-bg);}
  .save-hint{font-family:var(--sans);font-size:11.5px;color:var(--ink-faint);}
  .toast{font-family:var(--sans);font-size:12.5px;color:#fff;background:var(--accent);border-radius:4px;
    padding:8px 13px;margin-top:12px;display:none;box-shadow:var(--shadow-md);}
  .toast.show{display:block;}

  .path-summary{font-family:var(--sans);font-size:11.5px;color:var(--ink-faint);border-top:1px dotted var(--paper-edge);
    margin-top:16px;padding-top:12px;line-height:1.7;}
  .path-summary b{color:var(--ink-soft);font-weight:600;}
  .path-summary .ps-item{display:inline-block;background:var(--paper);border:1px solid var(--paper-edge);border-radius:99px;
    padding:2px 9px;margin:3px 4px 0 0;color:var(--ink-soft);}
  .path-summary .ps-item.cur{background:var(--accent-bg);border-color:var(--accent-soft);color:var(--accent);font-weight:600;}

  .end-screen{text-align:center;padding:30px 18px;}
  .end-screen .es-icon{font-size:34px;}
  .end-screen .es-msg{font-family:var(--serif);font-size:18px;color:var(--accent);margin:10px 0 6px;font-weight:600;}
  .end-screen .es-sub{font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);}
</style>
</head>
<body>

<div class="top-bar">
  <div class="chap-info">
    <span class="k">第八章 · 决策导航页</span>
    <span class="v">全书可视化流程图</span>
  </div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
    <span class="progress-label" id="progLabel">尚未开始</span>
  </div>
  <div class="save-flag" id="saveFlag">已保存中间记录 ✓</div>
</div>

<div class="soft-prompt" id="softPrompt">
  <span class="sp-lbl">建议先完成：</span>
  <span class="sp-chip" data-go="ch04">ch04 价值观</span>
  <span class="sp-chip" data-go="ch05">ch05 长处</span>
  <span class="sp-chip" data-go="ch06">ch06 喜欢</span>
  <span class="sp-chip" data-go="ch07">ch07 想做的事</span>
  <button class="sp-close" title="收起" onclick="document.getElementById('softPrompt').style.display='none'">×</button>
</div>

<div class="layout">
  <!-- LEFT: full flowchart -->
  <div class="flow-wrap">
    <div class="flow-title">
      <h2>流程图总览</h2>
      <div class="legend">
        <i><span class="dot-cur"></span>当前</i>
        <i><span class="dot-vis"></span>已答</i>
        <i><span class="dot-fut"></span>未达</i>
      </div>
    </div>
    <div id="flowchart"></div>
  </div>

  <!-- RIGHT: questionnaire -->
  <div class="quiz" id="quiz"></div>
</div>

<script>
/* ===== 与 chapter_config_ch08.json 完全对齐的契约数据 ===== */
const CH_TITLE = {ch04:"第四章 · 寻找自己的价值观", ch05:"第五章 · 寻找自己的长处", ch06:"第六章 · 寻找自己喜欢的领域", ch07:"第七章 · 组合出想做的事"};
const FLOW = {
  stages:[
    { id:"stage-1", title:"阶段一 · 探索价值观（确定『为何而活』与『工作目的』）", dps:[
      { id:"dp-1", q:"是否明确自己为何而活？", branches:[
        {label:"是", next:"dp-2"},
        {label:"否", jump:{chapter:"ch04", hint:"前往《寻找自己的价值观！》做价值观练习"}},
        {label:"找到了价值观", next:"dp-2"},
        {label:"找不到价值观", jump:{chapter:"ch04", question_key:"value_questions", hint:"回答问题清单中的30个问题"}},
        {label:"还是没找到", jump:{chapter:"ch04", question_key:"value_questions", hint:"回答问题清单中带⭐的问题（即全部30问），明确工作目的后继续"}, next:"dp-2"}
      ]},
      { id:"dp-2", q:"是否明确工作目的？", branches:[
        {label:"是", next:"dp-3"},
        {label:"否", jump:{chapter:"ch04", hint:"前往《寻找自己的价值观！》明确工作目的"}}
      ]}
    ]},
    { id:"stage-2", title:"阶段二 · 探索长处（确定『能取得成果的能力』）", dps:[
      { id:"dp-3", q:"是否有能取得成果的长处？", branches:[
        {label:"是", next:"dp-4"},
        {label:"找到了", next:"dp-4"},
        {label:"找到了长处", next:"dp-4"},
        {label:"否", jump:{chapter:"ch05", hint:"前往《寻找自己的长处吧！》做才能练习"}},
        {label:"没找到", jump:{chapter:"ch05", question_key:"talent_questions", hint:"回答问题清单中的30个问题"}}
      ]}
    ]},
    { id:"stage-3", title:"阶段三 · 探索兴趣与结合应用（寻找『喜欢的事』）", dps:[
      { id:"dp-4", q:"有没有感兴趣或有热情的领域？", branches:[
        {label:"否", jump:{chapter:"ch06", hint:"前往《寻找自己喜欢的领域吧！》做喜欢的事练习"}},
        {label:"没找到", hint_only:"喜欢的事终究只是为了实现『工作目的』的手段。确定能够实现工作目的的领域，边工作边培养吧！", next:"dp-4"},
        {label:"是", jump:{chapter:"ch07", hint:"通过组合喜欢和擅长的事，假设一个想做的事"}}
      ]}
    ]},
    { id:"stage-4", title:"阶段四 · 提炼目标与落实手段", dps:[
      { id:"dp-refine", q:"通过『工作目的』提炼出『想做的事』了吗？", branches:[
        {label:"去提炼", jump:{chapter:"ch07", hint:"通过『工作目的』提炼出『想做的事』（ch07 筛选定稿）"}},
        {label:"提炼成功", next:"dp-5"}
      ]},
      { id:"dp-5", q:"是否找到实现真正想做的事的手段？", branches:[
        {label:"找到了", next:"end"},
        {label:"没找到", hint_only:"通过书、网络、研讨会等收集信息。", next:"end"},
        {label:"找到了（收集后）", next:"end"}
      ]}
    ]}
  ],
  end:{ id:"end", message:"辛苦了！全身心投入到实现真正想做的事情中去吧！" }
};

/* 扁平化决策点顺序 */
const DP_ORDER = [];
FLOW.stages.forEach(s=>s.dps.forEach(d=>DP_ORDER.push(d.id)));
const DP_MAP = {};
FLOW.stages.forEach(s=>s.dps.forEach(d=>DP_MAP[d.id]={...d, stage:s.title}));

/* ===== 状态：模拟 flowchart_state 表，持久化到 localStorage ===== */
const STORE_KEY = "ww_ch08_flowchart_state";
let state = {};   // dpId -> {selectedBranch, comment, savedAt}
let current = "dp-1";

function loadState(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) state = JSON.parse(raw) || {}; }catch(e){ state={}; }
}
function persist(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function ensure(dpId){ if(!state[dpId]) state[dpId]={selectedBranch:null, comment:"", savedAt:null}; return state[dpId]; }

/* ===== 渲染左侧完整流程图 ===== */
function buildFlowchart(){
  const root = document.getElementById("flowchart");
  root.innerHTML = "";
  FLOW.stages.forEach((stage, si)=>{
    const sh = document.createElement("div");
    sh.className = "stage-head";
    sh.textContent = stage.title;
    root.appendChild(sh);
    stage.dps.forEach((dp, di)=>{
      const rec = state[dp.id] || {};
      const node = document.createElement("div");
      node.className = "fc-node" + (rec.selectedBranch ? " visited":"") + (dp.id===current ? " current":"");
      node.dataset.dp = dp.id;
      let branchesHtml = dp.branches.map(b=>{
        const chosen = rec.selectedBranch===b.label;
        const isJump = !!b.jump;
        const tgt = branchTarget(b);
        return `<span class="fc-branch${chosen?' chosen':''}${chosen&&isJump?' jump':''}">${b.label}${tgt?' · '+tgt:''}</span>`;
      }).join("");
      node.innerHTML = `
        <div class="fc-node-head">
          <span class="fc-dp-num"></span>
          <span class="fc-q">${dp.q}</span>
        </div>
        <div class="fc-branches">${branchesHtml}</div>`;
      node.onclick = ()=>{ current = dp.id; renderRight(); renderFlowchartActive(); };
      root.appendChild(node);
      // connector to next dp (or stage gap)
      const isLastInStage = di===stage.dps.length-1;
      const isLastOverall = si===FLOW.stages.length-1 && isLastInStage;
      if(!isLastOverall){
        const c = document.createElement("div");
        c.className = "fc-connector" + (isLastInStage?" stage-gap":"");
        root.appendChild(c);
      }
    });
  });
  // terminal
  const end = document.createElement("div");
  end.className = "fc-end";
  end.innerHTML = `<div class="e-lbl">终点</div><div class="e-msg">${FLOW.end.message}</div>`;
  root.appendChild(end);
}
function renderFlowchartActive(){ buildFlowchart(); }

function branchTarget(b){
  if(b.next==="end") return "→ 终点";
  if(b.next) return "→ 下一步";
  if(b.jump) return "↪ "+b.jump.chapter.toUpperCase();
  if(b.hint_only) return "· 提示";
  return "";
}

/* ===== 渲染右侧问卷（当前决策点） ===== */
function renderRight(){
  const quiz = document.getElementById("quiz");
  if(current==="end"){ renderEnd(quiz); updateProgress(); return; }
  const dp = DP_MAP[current];
  const rec = ensure(current);

  let branchHtml = dp.branches.map((b,i)=>{
    const sel = rec.selectedBranch===b.label;
    const isJump = !!b.jump;
    const tgt = branchTarget(b);
    return `<button class="branch-btn${sel?' sel':''}${isJump?' jump':''}" data-i="${i}">
              <span>${b.label}</span><span class="bb-tag">${tgt}</span>
            </button>`;
  }).join("");

  quiz.innerHTML = `
    <div class="quiz-head">
      <div class="qh-left">
        <span class="qh-k">问卷 · 当前决策点</span>
        <span class="qh-t">${dp.id.toUpperCase()}</span>
      </div>
      <span class="qh-step" id="qhStep"></span>
    </div>
    <div class="quiz-body">
      <span class="q-stage-tag">${dp.stage}</span>
      <p class="q-question">${dp.q}</p>
      <p class="q-sub">选择一个分支作答；可随时保存当前进度，无需答完全部。</p>
      <div class="branch-grid" id="branchGrid">${branchHtml}</div>
      <div id="jumpSlot"></div>
      <div id="hintSlot"></div>

      <div class="comment-box">
        <label>我的备注（每决策点可独立记录）<span class="saved-at" id="savedAt"></span></label>
        <textarea id="comment" placeholder="在这里写下你的想法、犹豫或下一步打算……">${rec.comment||""}</textarea>
      </div>
      <div class="save-row">
        <button class="btn" id="saveBtn">保存进度</button>
        <span class="save-hint">保存中间记录 · 不要求答完</span>
      </div>
      <div class="toast" id="toast">已保存中间记录</div>
      <div class="path-summary" id="pathSummary"></div>
    </div>`;

  document.getElementById("qhStep").textContent = stepInfo();
  if(rec.savedAt) document.getElementById("savedAt").textContent = "· 上次保存于 "+rec.savedAt;

  // branch click
  quiz.querySelectorAll(".branch-btn").forEach(btn=>{
    btn.onclick = ()=>{
      const b = dp.branches[+btn.dataset.i];
      rec.selectedBranch = b.label;
      persist();                                   // 自动留存选择（中间记录，可重载恢复）
      renderJumpAndHint(b);
      if(b.next){ current = b.next; }               // 真实跳转分支：展示前往卡片，current 停留本决策点
      renderRight(); renderFlowchartActive(); updateProgress();
    };
  });

  // 若已有选择，回显 jump / hint 槽
  if(rec.selectedBranch){
    const b = dp.branches.find(x=>x.label===rec.selectedBranch);
    if(b) renderJumpAndHint(b, true);
  }

  // 备注即时存（自动）
  const ta = document.getElementById("comment");
  ta.oninput = ()=>{ rec.comment = ta.value; persist(); };

  document.getElementById("saveBtn").onclick = ()=>{
    rec.comment = document.getElementById("comment").value;
    rec.savedAt = nowStr();
    persist();
    document.getElementById("savedAt").textContent = "· 上次保存于 "+rec.savedAt;
    showToast("已保存中间记录（"+dp.id.toUpperCase()+"）");
    flashSaveFlag();
    updateProgress();
  };

  renderPathSummary();
  updateProgress();
}

function renderJumpAndHint(b, silent){
  const jumpSlot = document.getElementById("jumpSlot");
  const hintSlot = document.getElementById("hintSlot");
  jumpSlot.innerHTML=""; hintSlot.innerHTML="";
  if(b.jump){
    const j=b.jump;
    jumpSlot.innerHTML = `<div class="jump-cta">
        <div class="jc-chap">↪ 前往 ${CH_TITLE[j.chapter]||j.chapter.toUpperCase()}</div>
        <div class="jc-hint">${j.hint||""}</div>
        ${j.question_key?`<div class="jc-qk">问题清单：${j.question_key}（30问）</div>`:""}
        <button class="jump-btn" id="jumpBtn">前往该章练习 →</button>
      </div>`;
    document.getElementById("jumpBtn").onclick = ()=> showToast("（原型演示）即将跳转到 "+ (CH_TITLE[j.chapter]||j.chapter));
  }
  if(b.hint_only){
    hintSlot.innerHTML = `<div class="hint-callout"><span class="hc-lbl">提示</span>${b.hint_only}</div>`;
  }
}

function renderEnd(quiz){
  quiz.innerHTML = `
    <div class="quiz-head">
      <div class="qh-left"><span class="qh-k">问卷 · 当前位置</span><span class="qh-t">终点</span></div>
    </div>
    <div class="quiz-body"><div class="end-screen">
      <div class="es-icon">🌟</div>
      <div class="es-msg">${FLOW.end.message}</div>
      <div class="es-sub">你已走完决策导航。可随时回到任意决策点修改备注或重新选择。</div>
    </div>
    <div class="path-summary" id="pathSummary"></div></div>`;
  renderPathSummary();
}

function renderPathSummary(){
  const el = document.getElementById("pathSummary");
  if(!el) return;
  const items = DP_ORDER.filter(id=>state[id]&&state[id].selectedBranch)
    .map(id=>`<span class="ps-item${id===current?' cur':''}">${id.toUpperCase()}：${state[id].selectedBranch}</span>`).join("");
  el.innerHTML = items ? `<b>已记录路径：</b><br>${items}` : `<b>已记录路径：</b> 暂无（点击左侧任意决策点开始，或先保存当前备注）`;
}

function stepInfo(){
  const idx = DP_ORDER.indexOf(current);
  return "第 "+(idx+1)+" / "+DP_ORDER.length+" 个决策点";
}

/* ===== 进度 & 提示 ===== */
function updateProgress(){
  const done = DP_ORDER.filter(id=>state[id]&&state[id].selectedBranch).length;
  const pct = Math.round(done/DP_ORDER.length*100);
  document.getElementById("progFill").style.width = pct+"%";
  document.getElementById("progLabel").textContent = done? ("已作答 "+done+" / "+DP_ORDER.length) : "尚未开始";
}
function flashSaveFlag(){
  const f = document.getElementById("saveFlag");
  f.classList.add("show");
  setTimeout(()=>f.classList.remove("show"), 1800);
}
function showToast(msg){
  const t = document.getElementById("toast");
  if(!t) return;
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}
function nowStr(){
  const d=new Date(); const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ===== 软提示跳转（原型） ===== */
document.getElementById("softPrompt").querySelectorAll(".sp-chip").forEach(c=>{
  c.onclick = ()=> showToast("（原型演示）前往 "+ (CH_TITLE[c.dataset.go]||c.dataset.go));
});

/* ===== 初始化 ===== */
loadState();
// 恢复到第一个未作答的决策点（若有记录）
const firstUnanswered = DP_ORDER.find(id=>!(state[id]&&state[id].selectedBranch));
if(firstUnanswered) current = firstUnanswered;
buildFlowchart();
renderRight();
updateProgress();
</script>
</body>
</html>
