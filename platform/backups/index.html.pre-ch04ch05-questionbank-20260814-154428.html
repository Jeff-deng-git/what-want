<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 1 1%27%3E%3Crect width=%271%27 height=%271%27 fill=%27%23b08d57%27/%3E%3C/svg%3E">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Want</title>
<style>
  :root {
    --paper: #f6efde;
    --paper-edge: #ebe1c8;
    --paper-light: #faf4e3;
    --ink: #2a2620;
    --ink-soft: #6b6354;
    --ink-faint: #9c937f;
    --accent: #7a4d2b;
    --accent-soft: #d8c4a3;
    --accent-bg: #f1e8d2;
    --rule: #d9cfb6;
    --shadow-sm: 0 1px 0 rgba(74,55,28,0.04), 0 2px 6px rgba(74,55,28,0.04);
    --shadow-md: 0 2px 4px rgba(74,55,28,0.05), 0 8px 24px rgba(74,55,28,0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "SimSun", serif;
    background-color: var(--paper);
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(180,150,100,0.08), transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(180,150,100,0.06), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(255,250,235,0.4), transparent 70%);
    color: var(--ink);
    line-height: 1.85;
    font-size: 15px;
  }
  #app { min-height: 100vh; }

  /* ===== LANDING ===== */
  .landing-wrap { max-width: 900px; margin: 0 auto; padding: 64px 24px 80px; }
  .hero { text-align: center; padding: 0 0 40px; border-bottom: 1px solid var(--rule); margin-bottom: 32px; }
  .hero .chapter-num { font-size: 11px; color: var(--ink-faint); letter-spacing: 4px; margin-bottom: 10px; }
  .hero h1 { font-size: 36px; margin: 0 0 12px; font-weight: 700; letter-spacing: 2px; }
  .hero .quote { font-style: italic; color: var(--ink-soft); font-size: 14px; margin: 0; }
  .continue-card {
    background: var(--paper-light); border: 1px solid var(--accent-soft);
    border-left: 1.5px solid var(--accent); border-radius: 4px;
    padding: 20px 24px; margin-bottom: 32px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow-sm);
  }
  .continue-card:hover { border-left-color: #8b5e3c; background: #faf0de; }
  .continue-card .lbl { font-size: 11px; color: var(--accent); letter-spacing: 2px; margin-bottom: 4px; }
  .continue-card .t { font-size: 17px; font-weight: 700; }
  .continue-card .sub { font-size: 12px; color: var(--ink-soft); }
  .continue-card .arr { color: var(--accent); font-size: 22px; }
  .section-label {
    display: flex; align-items: center; gap: 12px;
    font-size: 12px; color: var(--ink-soft); letter-spacing: 3px; margin: 28px 0 16px;
  }
  .section-label::before, .section-label::after { content: ''; flex: 1; height: 1px; background: var(--rule); }
  .ch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .ch-card {
    background: var(--paper-light); border: 1px solid var(--paper-edge);
    border-radius: 4px; padding: 18px; cursor: pointer;
    transition: all 0.2s; position: relative; box-shadow: var(--shadow-sm);
  }
  .ch-card:hover { border-color: var(--accent-soft); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .ch-card.current { border-color: var(--accent); border-left: 1.5px solid var(--accent); }
  .ch-card .seal { position: absolute; top: 14px; right: 14px; background: var(--accent); color: var(--paper); font-size: 9px; padding: 2px 6px; border-radius: 2px; letter-spacing: 1px; }
  .ch-card .num { font-size: 11px; color: var(--accent); letter-spacing: 2px; margin-bottom: 6px; font-weight: 600; }
  .ch-card .title { font-size: 15px; font-weight: 600; margin: 0 0 6px; line-height: 1.4; }
  .ch-card .meta { font-size: 11px; color: var(--ink-faint); }
  .ch-card .prog { height: 3px; background: var(--paper-edge); margin-top: 10px; overflow: hidden; }
  .ch-card .prog > div { height: 100%; background: var(--accent); }

  /* ===== READING PAGE ===== */
  .reader { max-width: 1320px; margin: 0 auto; padding: 12px 24px 80px; }
  .reader.two-col { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
  .reader.three-col { display: grid; grid-template-columns: 190px 1fr 340px; gap: 20px; }
  .reader .top-bar { grid-column: 1 / -1; }

  /* top sticky bar */
  .top-bar {
    position: sticky; top: 0; z-index: 40;
    background: rgba(246,239,222,0.97); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--rule); padding: 12px 0; margin-bottom: 24px;
    display: flex; align-items: center; gap: 12px;
    font-family: -apple-system, "PingFang SC", sans-serif; font-size: 12px;
  }
  .top-bar .home-btn {
    background: var(--ink); color: var(--paper); border: none; padding: 5px 12px;
    border-radius: 3px; cursor: pointer; font-size: 12px;
  }
  .top-bar .home-btn:hover { background: var(--accent); }
  .top-bar .ch-info { flex: 1; min-width: 0; }
  .top-bar .ch-info div:first-child { font-size: 10px; color: var(--ink-faint); letter-spacing: 2px; }
  .top-bar .ch-info div:last-child { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-bar .prog-track { width: 90px; height: 3px; background: var(--paper-edge); overflow: hidden; }
  .top-bar .prog-track > div { height: 100%; background: var(--accent); }
  .top-bar .prog-text { font-size: 10px; color: var(--ink-soft); width: 28px; text-align: right; }
  .top-bar .nav-btn {
    border: 1px solid var(--rule); background: var(--paper-light);
    padding: 4px 10px; border-radius: 3px; font-size: 11px; cursor: pointer; font-family: inherit;
  }
  .top-bar .nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .top-bar .nav-btn:disabled { color: var(--ink-faint); cursor: not-allowed; }

  /* directory dropdown */
  .dir-wrap { position: relative; }
  .dir-drop {
    position: absolute; top: 36px; left: 0; z-index: 70;
    width: 320px; max-height: 70vh; overflow-y: auto;
    background: var(--paper-light); border: 1px solid var(--paper-edge);
    border-radius: 6px; box-shadow: 0 8px 24px rgba(74,55,28,0.14);
    display: none; padding: 10px 0;
  }
  .dir-drop.open { display: block; }
  .dir-drop .grp { font-size: 10px; color: var(--ink-faint); letter-spacing: 2px; padding: 6px 14px 4px; }
  .dir-drop .d-item { padding: 7px 14px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 8px; }
  .dir-drop .d-item:hover { background: var(--accent-bg); }
  .dir-drop .d-item.cur { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .dir-drop .d-item .d-num { width: 16px; height: 16px; border-radius: 50%; background: var(--paper-edge); color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 9px; flex-shrink: 0; font-family: -apple-system, sans-serif; }
  .dir-drop .d-item.cur .d-num { background: var(--accent); color: var(--paper); }
  .dir-drop .d-sub { padding: 5px 14px 5px 34px; font-size: 11px; color: var(--ink-soft); cursor: pointer; }
  .dir-drop .d-sub:hover { color: var(--accent); }
  .dir-drop .sep { height: 1px; background: var(--rule); margin: 8px 0; }

  /* left step nav (3-col only) */
  .step-nav {
    background: var(--paper-light); border: 1px solid var(--paper-edge);
    border-radius: 4px; padding: 14px; box-shadow: var(--shadow-sm);
    position: sticky; top: 70px; max-height: calc(100vh - 100px); overflow-y: auto;
  }
  .step-nav h3 { font-size: 11px; color: var(--ink-soft); letter-spacing: 3px; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .step-nav .item { padding: 8px 10px; margin-bottom: 4px; border-radius: 3px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .step-nav .item:hover { background: var(--accent-bg); }
  .step-nav .item.active { background: var(--ink); color: var(--paper); }
  .step-nav .item .n { width: 20px; height: 20px; border-radius: 50%; background: var(--paper-edge); color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; font-family: -apple-system, sans-serif; }
  .step-nav .item.submitted .n, .step-nav .item.active .n { background: var(--accent); color: var(--paper); }

  /* center content */
  .chapter-content {
    background: var(--paper-light); border: 1px solid var(--paper-edge);
    border-radius: 4px; padding: 40px 44px; box-shadow: var(--shadow-sm);
    line-height: 1.95; font-size: 16px;
  }
  .reader.three-col .chapter-content { max-height: calc(100vh - 100px); overflow-y: auto; position: sticky; top: 70px; }
  .reader.two-col .chapter-content { max-height: calc(100vh - 100px); overflow-y: auto; position: sticky; top: 70px; }
  .chapter-content h1 { font-size: 26px; text-align: center; margin: 0 0 24px; padding-bottom: 16px; border-bottom: 1px solid var(--rule); letter-spacing: 1px; }
  .chapter-content h2 { font-size: 18px; margin: 24px 0 10px; padding-left: 10px; border-left: 3px solid var(--accent); }
  .chapter-content p { margin: 12px 0; }
  .chapter-content .quote { border-left: 3px solid var(--accent); background: var(--accent-bg); padding: 12px 16px; margin: 16px 0; font-style: italic; color: var(--ink-soft); border-radius: 0 4px 4px 0; font-size: 15px; }
  .chapter-content em { color: var(--accent); font-style: normal; font-weight: 600; }
  .chapter-content img { max-width: 100%; }
  .chapter-content mark.note-mark {
    background: linear-gradient(transparent 60%, var(--accent-bg) 60%);
    border-bottom: 1.5px dotted var(--accent-soft);
    padding: 0 1px; border-radius: 1px;
    cursor: pointer; color: inherit;
    transition: background 0.15s, border-color 0.15s;
  }
  .chapter-content mark.note-mark:hover,
  .chapter-content mark.note-mark.hover {
    background: linear-gradient(transparent 0%, rgba(122,77,43,0.18) 0%);
    border-bottom-color: var(--accent); border-bottom-style: solid;
  }
  .note-preview-popup {
    position: fixed; z-index: 91; width: min(360px, calc(100vw - 24px));
    background: #fffdf7; color: var(--ink); border: 1px solid var(--paper-edge);
    border-radius: 6px; padding: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.14);
    font-family: -apple-system, "PingFang SC", sans-serif;
  }
  .note-preview-popup .hd { color: var(--accent); font-size: 10px; letter-spacing: 1px; margin-bottom: 7px; }
  .note-preview-popup .src { background: var(--paper-light); border-left: 2px solid var(--accent-soft); color: var(--ink-soft); padding: 6px 8px; border-radius: 3px; margin-bottom: 8px; font-style: italic; font-size: 11px; line-height: 1.5; max-height: 72px; overflow: auto; }
  .note-preview-popup .content { white-space: pre-wrap; color: var(--ink); font-size: 12px; line-height: 1.6; max-height: 180px; overflow: auto; }
  .note-preview-popup .actions { display: flex; justify-content: flex-end; margin-top: 9px; }
  .note-preview-popup button { padding: 4px 10px; border: 1px solid var(--paper-edge); border-radius: 3px; background: var(--paper-light); color: var(--ink); font-size: 10px; cursor: pointer; font-family: inherit; }
  .note-preview-popup button:hover { border-color: var(--accent); color: var(--accent); }
  .note-card[data-note-id] { cursor: pointer; transition: transform 0.15s; }
  .note-card[data-note-id]:hover { transform: translateX(-2px); }
  .note-card.note-flash { animation: note-flash 1.4s ease-out; }
  @keyframes note-flash { 0% { box-shadow: 0 0 0 3px var(--accent); transform: scale(1.02); } 100% { box-shadow: 0 0 0 0 transparent; transform: scale(1); } }

  /* right panel: tabbed sidebar */
  .side-panel {
    background: #fffdf7; border: 1px solid var(--paper-edge);
    border-radius: 4px; box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column;
    position: sticky; top: 70px; max-height: calc(100vh - 100px);
  }
  .side-tabs { display: flex; border-bottom: 1px solid var(--rule); flex-shrink: 0; }
  .side-tabs .st {
    flex: 1; text-align: center; padding: 12px 4px 10px;
    font-size: 11px; color: var(--ink-soft); cursor: pointer;
    letter-spacing: 2px; border-bottom: 2px solid transparent;
    transition: all 0.15s; font-family: -apple-system, "PingFang SC", sans-serif;
  }
  .side-tabs .st:hover { color: var(--ink); background: var(--accent-bg); }
  .side-tabs .st.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .side-pane { display: none; flex: 1; min-height: 0; overflow-y: auto; }
  .side-pane.active { display: flex; flex-direction: column; }

  /* summary pane */
  .summary-pane { padding: 14px; background: #fffdf7; }
  .s-card {
    background: #fffdf7; border: 1px solid var(--paper-edge);
    border-left: 1.5px solid var(--accent); border-radius: 4px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .s-card .lbl { font-size: 10px; color: var(--accent); letter-spacing: 2px; margin-bottom: 8px; font-weight: 600; display: flex; justify-content: space-between; }
  .s-card .lbl .act { cursor: pointer; color: var(--ink-faint); letter-spacing: 0; font-weight: normal; }
  .s-card .lbl .act:hover { color: var(--accent); }
  .s-card p { margin: 0; font-size: 13px; line-height: 1.75; color: var(--ink); }
  .s-card ul { list-style: none; padding: 0; margin: 0; }
  .s-card ul li { padding: 5px 0 5px 14px; position: relative; font-size: 12px; color: var(--ink); border-bottom: 1px dotted var(--paper-edge); }
  .s-card ul li:last-child { border-bottom: none; }
  .s-card ul li::before { content: '◆'; position: absolute; left: 0; top: 6px; color: var(--accent); font-size: 9px; }
  .s-card .concept-name { display: block; font-weight: 600; }
  .s-card .concept-exp { display: block; font-size: 11px; color: var(--ink-soft); margin-top: 2px; line-height: 1.55; padding-left: 2px; }
  .s-card ol { counter-reset: s; list-style: none; padding: 0; margin: 0; }
  .s-card ol li { padding: 4px 0 4px 24px; position: relative; font-size: 12px; color: var(--ink); line-height: 1.65; }
  .s-card ol li::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 4px; width: 16px; height: 16px; background: var(--accent); color: var(--paper); border-radius: 50%; font-size: 10px; display: flex; align-items: center; justify-content: center; font-family: -apple-system, sans-serif; }
  .no-content { color: var(--ink-faint); font-size: 12px; text-align: center; padding: 30px 0; }
  .gen-btn {
    display: block; width: 100%; background: var(--ink); color: var(--paper); border: none;
    padding: 8px 0; border-radius: 3px; font-size: 12px; cursor: pointer; letter-spacing: 1px; font-family: inherit;
  }
  .gen-btn:hover { background: var(--accent); }
  .gen-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* chat pane */
  .chat-pane { background: #fffdf7; }
  .chat-head {
    padding: 12px 14px; border-bottom: 1px solid var(--rule);
    display: flex; align-items: center; gap: 8px; background: var(--paper-light); flex-shrink: 0;
  }
  .chat-head .av { width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: var(--paper); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0; }
  .chat-head .info { flex: 1; min-width: 0; }
  .chat-head .info .n { font-weight: 700; font-size: 12px; }
  .chat-head .info .r { font-size: 10px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-head .close-x { cursor: pointer; color: var(--ink-faint); font-size: 16px; line-height: 1; padding: 0 2px; flex-shrink: 0; }
  .chat-head .close-x:hover { color: var(--accent); }
  .chat-head .clear-btn { cursor: pointer; color: var(--ink-faint); font-size: 10px; flex-shrink: 0; }
  .chat-head .clear-btn:hover { color: #a3342b; }
  .chat-msgs { flex: 1; overflow-y: auto; padding: 14px; }
  .chat-msg { display: flex; gap: 8px; margin-bottom: 12px; }
  .chat-msg.user { flex-direction: row-reverse; }
  .chat-msg .m-av { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--paper); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; flex-shrink: 0; }
  .chat-msg.user .m-av { background: var(--accent-soft); color: var(--ink); }
  .chat-msg .bub { max-width: 82%; padding: 8px 12px; border-radius: 10px; font-size: 12px; line-height: 1.6; white-space: pre-wrap; }
  .chat-msg.mentor .bub { background: var(--paper-light); border: 1px solid var(--paper-edge); border-bottom-left-radius: 4px; }
  .chat-msg.user .bub { background: var(--ink); color: var(--paper); border-bottom-right-radius: 4px; }
  .chat-input { padding: 10px 14px; border-top: 1px solid var(--rule); background: var(--paper-light); flex-shrink: 0; }
  .chat-input textarea { width: 100%; border: 1px solid var(--paper-edge); border-radius: 4px; padding: 8px 10px; font-size: 12px; resize: none; height: 44px; font-family: inherit; background: var(--paper); }
  .chat-input textarea:focus { outline: none; border-color: var(--accent); }
  .chat-input .row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-family: -apple-system, sans-serif; }
  .chat-input .h { font-size: 10px; color: var(--ink-faint); }
  .chat-input button { background: var(--ink); color: var(--paper); border: none; padding: 4px 12px; border-radius: 3px; font-size: 11px; cursor: pointer; letter-spacing: 1px; }
  .chat-input button:hover { background: var(--accent); }

  /* steps pane (full runner) */
  .steps-pane { padding: 14px; background: #fffdf7; }
  .st-card {
    background: #fffdf7; border: 1px solid var(--paper-edge);
    border-left: 3px solid var(--paper-edge); border-radius: 4px;
    padding: 12px 14px; margin-bottom: 10px; cursor: pointer; transition: all 0.15s;
  }
  .st-card:hover { border-left-color: var(--accent-soft); }
  .st-card.now { border-left-color: var(--accent); background: var(--accent-bg); }
  .st-card .ttl { font-size: 12px; font-weight: 600; margin-bottom: 3px; }
  .st-card .st { font-size: 10px; color: var(--accent); letter-spacing: 1px; }
  .step-runner { position: relative; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--rule); }
  .step-guide { position: absolute; top: 8px; right: 0; z-index: 4; }
  .step-guide-btn {
    width: 20px; height: 20px; padding: 0; border: 1px solid var(--ink-faint); border-radius: 50%;
    background: var(--paper-light); color: var(--ink-soft); font: 600 12px/18px -apple-system, sans-serif; cursor: pointer;
  }
  .step-guide-btn:hover, .step-guide-btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
  .step-guide-popover {
    display: none; position: absolute; top: 27px; right: 0; width: min(290px, calc(100vw - 48px));
    padding: 10px 12px; border: 1px solid var(--paper-edge); border-radius: 4px;
    background: #fffdf7; box-shadow: var(--shadow-md); color: var(--ink-soft); font-size: 11px; line-height: 1.65;
  }
  .step-guide-popover.open { display: block; }
  .step-guide-popover strong { color: var(--ink); }
  .step-guide-popover ol { margin: 5px 0 0; padding-left: 18px; }
  .step-runner .run-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .step-runner .run-head .t { font-size: 13px; font-weight: 700; }
  .step-runner .run-head .status { font-size: 10px; color: var(--accent); letter-spacing: 1px; }
  .step-runner .q { background: #fffdf7; border: 1px solid var(--paper-edge); border-radius: 4px; padding: 12px 14px; margin-bottom: 12px; }
  .step-runner .q .qt { font-size: 11px; color: var(--ink-soft); margin-bottom: 8px; line-height: 1.6; }
  .step-runner .q textarea {
    width: 100%; border: 1px solid var(--paper-edge); border-radius: 3px;
    padding: 10px 12px; font-size: 12px; min-height: 92px; line-height: 1.65; resize: vertical;
    font-family: inherit; background: var(--paper); color: var(--ink);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .step-runner .q textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(122,77,43,0.08); }
  .schema-checklist { display: grid; gap: 10px; }
  .schema-check-card {
    border: 1px solid var(--paper-edge); border-left: 3px solid var(--paper-edge);
    border-radius: 4px; padding: 10px 12px; background: var(--paper-light);
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
  }
  .schema-check-card.is-checked {
    border-left-color: var(--accent); background: var(--accent-bg); transform: translateY(2px);
  }
  .schema-check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .schema-check input { accent-color: var(--accent); }
  .schema-check-card .schema-wrong,
  .schema-check-card .schema-right { margin-top: 5px; padding-left: 24px; font-size: 11px; line-height: 1.55; }
  .schema-check-card .schema-wrong { color: #8c4b3d; }
  .schema-check-card .schema-right { color: #4e7259; }
  .schema-followup-label { display: block; margin: 8px 0 4px 24px; color: var(--ink-soft); font-size: 10px; }

<body>

<div id="app"><div class="status">加载中…</div></div>

<script>
const API = 'http://localhost:8011';
const params = new URLSearchParams(window.location.search);
const chapterId = params.get('chapter');
const app = document.getElementById('app');

async function load(path) {
  return fetchJson(API + path);
}

// ============ CONTENT RENDER ============
function renderContent(content) {
  if (content.format === 'html' && content.pages && content.pages.length) {
    return content.pages.map((html, i) => {
      const bodyMatch = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
      let inner = bodyMatch ? bodyMatch[1] : html;
      inner = inner.replace(/src="\/api\//g, `src="${API}/api/`);
      return `<div class="page-section" data-page="${i + 1}">${inner}</div>`;
    }).join('\n<hr class="page-break">\n');
  }
  if (content.format === 'styled_html') {
    return content.pages.map((html, i) => {
      const bodyMatch = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
      let inner = bodyMatch ? bodyMatch[1] : html;
      inner = inner.replace(/src="\/api\//g, `src="${API}/api/`);
      return `<div class="page-section" data-page="${i+95}">${inner}</div>`;
    }).join('\n<hr class="page-break">\n');
  }
  if (content.markdown) return renderMarkdown(content.markdown);
  return '<p>暂无内容</p>';
}

function renderMarkdown(md) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const blocks = md.split(/\n\s*\n+/);
  const out = blocks.map(raw => {
    const block = raw.trim();
    if (!block) return '';
    const pbMatch = block.match(/<!--\s*page break:\s*(\d+)\s*-->/);
    if (pbMatch) return `<div class="page-break">第 ${pbMatch[1]} 页</div>`;
    const imgMatch = block.match(/^!\[图\]\((.+?)\)$/);
    if (imgMatch) {
      let src = imgMatch[1];
      if (src.startsWith('/api/')) src = API + src;
      return `<img src="${src}" alt="图" />`;
    }
    // Headings h1-h4
    const h4 = block.match(/^####\s+(.+)$/);   if (h4) return `<h4>${esc(h4[1])}</h4>`;
    const h3 = block.match(/^###\s+(.+)$/);     if (h3) return `<h3>${esc(h3[1])}</h3>`;
    if (block.startsWith('# '))   return `<h1>${esc(block.slice(2))}</h1>`;
    if (block.startsWith('## '))  return `<h2>${esc(block.slice(3))}</h2>`;
    // Blockquote (lines starting with "> ")
    if (/^>\s/.test(block)) {
      const lines = block.split('\n').map(l => esc(l.replace(/^>\s?/, ''))).join('<br>');
      return `<blockquote>${lines}</blockquote>`;
    }
    // Unordered list (lines starting with "- " or "* ")
    if (/^[-*]\s/.test(block)) {
      const items = block.split('\n').map(l => `<li>${esc(l.replace(/^[-*]\s+/, ''))}</li>`).join('');
      return `<ul>${items}</ul>`;
    }
    // Ordered list (lines starting with "1. " etc.)
    if (/^\d+\.\s/.test(block)) {
      const items = block.split('\n').map(l => `<li>${esc(l.replace(/^\d+\.\s+/, ''))}</li>`).join('');
      return `<ol>${items}</ol>`;
    }
    // Plain paragraph
    const paragraph = block.replace(/\n+/g, ' ');
    return `<p>${esc(paragraph)}</p>`;
  });
  return out.filter(Boolean).join('\n');
}

// ============ LANDING ============
async function renderList() {

    chapters.forEach(c => { readMap[c.id] = c; });
    app.innerHTML = `
      <div class="landing-wrap">

          <div class="chapter-num">卷 一 · 序</div>

          <p class="quote">"找不到想做的事，不是因为你不够好，而是因为你还没开始找。"</p>
        </div>
        ${lastReading && lastReading.chapter_id ? `
        <div class="continue-card" onclick="location='?chapter=${lastReading.chapter_id}'">
          <div>
            <div class="lbl">续 读</div>
            <div class="t">${lastReading.title || lastReading.chapter_id}</div>
            <div class="sub">${lastReading.progress_pct != null ? `进度 ${lastReading.progress_pct}% · ` : ''}${lastReading.scroll_position ? `滚动位置 ${Math.round(lastReading.scroll_position)}px` : ''}</div>
          </div>
          <div class="arr">→</div>
        </div>` : ''}
        <div class="section-label">全 部 卷 章</div>
        <div class="ch-grid">
          ${chapters.map(ch => `
            <div class="ch-card${ch.id === chapterId ? ' current' : ''}" onclick="location='?chapter=${ch.id}'">
              ${ch.has_steps && ch.progress_pct == 100 ? '<span class="seal">已 完 成</span>' : (ch.progress_pct != null ? '<span class="seal">阅 读 中</span>' : (ch.last_read_at ? '<span class="seal">已 读</span>' : '<span class="seal">未 读</span>'))}
              <div class="num">${ch.id === 'preface' ? '序' : (ch.id === 'questions' ? '附' : (ch.id === 'ch04' ? '第四章' : ch.id.toUpperCase()))}</div>
              <div class="title">${ch.title}</div>
              <div class="meta">${ch.has_steps ? `${ch.submitted_steps || 0}/${ch.total_steps} 步` : (ch.has_html ? '可阅读' : '仅参考')}</div>
              ${ch.progress_pct != null ? `<div class="prog"><div style="width:${ch.progress_pct}%"></div></div>` : ''}
            </div>`).join('')}
        </div>
      </div>
    `;
  } catch (e) {
    app.innerHTML = `<div class="error">加载失败：${e.message}<br>确认后端运行于 ${API}</div>`;
  }
}

// ============ READING ============
let allChapters = [];
let chapterMeta = {};
let currentRunByStep = {};
let allRoles = [];
let chapterSteps = [];
let currentChapterConfig = {};
let loadedChapterContent = '';
let noteById = new Map();
let notePreviewPopup = null;

async function applyCh07Lock() {
  let status = null;
  try { status = await load('/api/book/chapters/ch07/status'); } catch (e) { return; }
  if (!status || !status.lock_state || status.lock_state.ready) return false;
  const book = document.getElementById('bookContent');
  if (!book) return false;
  const upstream = status.lock_state.upstream_status || {};
  const items = Object.keys(upstream).map(cid => {
    const u = upstream[cid];
    return '<li>' + cid + '：' + (u.is_submitted ? '已完成' : '未完成') + ' (' + u.submitted_count + '/' + u.total_steps + ')</li>';
  }).join('');
  const overlay = document.createElement('div');
  overlay.id = 'ch07LockOverlay';
  overlay.className = 'gated-overlay';
  const missingFields = status.lock_state.missing_profile_fields || {};
  const fieldHint = Object.keys(missingFields).map(cid => {
    const fields = missingFields[cid] || [];
    return fields.length ? '<small>缺少字段：' + fields.join('、') + '</small>' : '';
  }).join('');
  overlay.innerHTML = '<div class="hd">本 章 暂 未 解 锁</div>'
    + '<div class="ttl">完成第三章与第四章后再回来</div>'
    + '<div>第七章需要第三章与第四章的真实产出。请先完成：</div>'
    + '<ul>' + items + '</ul>'
    + '<div class="gated-fields">' + fieldHint + '</div>'
    + '<div class="gated-actions">'
    +   '<button class="primary" onclick="location=\'?chapter=ch03\'">前往 ch03</button>'
    +   '<button onclick="location=\'?chapter=ch04\'">前往 ch04</button>'
    + '</div>';
  book.parentNode.insertBefore(overlay, book);
  return true;
}

async function renderReader() {
  ensureBridgeFloater();
  app.innerHTML = '<div class="status">加载章节内容…</div>';
  try {
    const [meta, content, chapters] = await Promise.all([
      load(`/api/book/chapters/${chapterId}`).catch(() => ({ id: chapterId, has_steps: false })),
      load(`/api/book/chapters/${chapterId}/content`).catch(() => null),
      load('/api/book/chapters').catch(() => []),
    ]);
    chapterMeta = meta;
    allChapters = chapters;
    loadedChapterContent = content ? renderContent(content) : '';

    /* Delegate mark clicks because #bookContent is created below. */
    if (!document._noteMarkBound) {
      document._noteMarkBound = true;
      document.addEventListener('click', (e) => {
        const mark = e.target.closest('#bookContent mark.note-mark');
        if (mark) showNotePreview(mark.dataset.noteId, mark);
      });
    }

    // Special: questions chapter -> question bank view
    if (chapterId === 'questions') { renderQuestions(); return; }

    const hasSteps = !!meta.has_steps;
    const tabs = hasSteps ? ['摘要','对话','步骤','笔记'] : ['摘要','对话','笔记'];
    const idx = allChapters.findIndex(c => c.id === chapterId);
    const prev = allChapters[idx - 1], next = allChapters[idx + 1];

    app.innerHTML = `
      <div class="reader ${hasSteps ? 'three-col' : 'two-col'}">
        <div class="top-bar"><button class="bridge-entry primary" onclick="openBridgeChat()" style="float:right">与导师聊聊本章 →</button><div class="dir-wrap">
            <button class="home-btn" onclick="toggleDir(event)">☰ 目录</button>
            <div class="dir-drop" id="dirDrop"></div>
          </div>
          <div class="ch-info">
            <div>${chapterMeta.title || chapterId}</div>
            <div>${hasSteps ? '步骤工作流' : '阅读'}</div>
          </div>
          <div class="prog-track" style="display:none"><div id="topProgFill"></div></div>
          <div class="prog-text" style="display:none" id="topProgText"></div>
          <button class="nav-btn" ${prev ? `onclick="location='?chapter=${prev.id}'"` : 'disabled'}>← ${prev ? (prev.id === 'preface' ? '序' : prev.title.slice(0, 4)) : ''}</button>
          <button class="nav-btn" ${next ? `onclick="location='?chapter=${next.id}'"` : 'disabled'}>${next ? (next.id === 'questions' ? '问题清单' : next.title.slice(0, 4)) : ''} →</button>
        </div>

        ${hasSteps ? `
        <nav class="step-nav">
          <h3>章 节 步 骤</h3>
          <div id="stepNavList"></div>
        </nav>` : ''}

        <article class="chapter-content" id="bookContent">${loadedChapterContent || '<p>暂无内容</p>'}
          <div style="margin-top:28px;padding-top:20px;border-top:1px solid var(--rule);text-align:center;">
            <button class="gen-btn" style="display:inline-block;width:auto;padding:10px 28px" onclick="switchTab('chat')">💬 与导师对话</button>
          </div>
        </article>

        <!-- 提交后的完成提示，显示在步骤侧栏 -->
        <aside class="side-panel" id="sidePanel">
          <div class="side-tabs">
            ${tabs.map(t => `<div class="st${t === '摘要' ? ' active' : ''}" data-pane="${t === '摘要' ? 'summary' : t === '对话' ? 'chat' : t === '步骤' ? 'steps' : 'notes'}" onclick="switchTab('${t === '摘要' ? 'summary' : t === '对话' ? 'chat' : t === '步骤' ? 'steps' : 'notes'}')">${t}</div>`).join('')}
          </div>
          <div class="side-pane summary-pane active" id="summaryPane"><div class="pane-pad no-content">加载摘要…</div></div>
          <div class="side-pane chat-pane" id="chatPane">
            <div class="chat-head">
              <div class="av">导</div>
              <div class="info"><div class="n">刘老师</div><div class="r">职业规划导师 · 本章会话</div></div>
              <span class="clear-btn" onclick="clearChat()" title="清空对话">清空</span>
              <span class="close-x" onclick="switchTab('summary')" title="退出对话">×</span>
            </div>
            <div class="chat-msgs" id="chatMsgs"><div class="no-content">暂无对话</div></div>
            <div class="chat-input">
              <textarea id="chatInput" placeholder="输入你的想法，导师会基于本章内容继续追问…"></textarea>
              <div class="row"><span class="h">Enter 发送</span><button onclick="sendChat()">发 送</button></div>
            </div>
          </div>
          ${hasSteps ? `<div class="side-pane steps-pane" id="stepsPane"><div id="bridgeCardSlot" class="bridge-card-slot" style="display:none"></div><div id="stepList"></div></div>` : ''}
          <div class="side-pane notes-pane" id="notesPane"><div id="notesList"></div></div>
        </aside>
      </div>
    `;

    // hooks
    setupSelectionNote();
    setupChatInput();
    loadSummary();
    loadChatHistory();
    loadNotes();
    buildDir();
    const chapterLocked = chapterId === 'ch07' ? await applyCh07Lock() : false;
    if (hasSteps && !chapterLocked) loadSteps();
    if (chapterLocked) {
      const list = document.getElementById('stepList');
      if (list) list.innerHTML = '<div class="pane-pad no-content">本章尚未解锁，请先完成上游章节。</div>';
      const chatInput = document.getElementById('chatInput');
      const sendButton = document.querySelector('#chatPane .chat-input button');
      if (chatInput) { chatInput.disabled = true; chatInput.placeholder = '完成上游章节后才能开始本章对话'; }
      if (sendButton) sendButton.disabled = true;
    }
    restoreScroll();

  } catch (e) {
    app.innerHTML = `<div class="error">加载失败：${e.message}<br>API: ${API}</div>`;
  }
}

// ============ TAB SWITCH ============
function switchTab(pane) {
  const panel = document.getElementById('sidePanel');
  if (!panel) return;
  panel.querySelectorAll('.side-tabs .st').forEach(t => t.classList.toggle('active', t.dataset.pane === pane));
  panel.querySelectorAll('.side-pane').forEach(p => p.classList.toggle('active', p.classList.contains(pane + '-pane')));
}

function ensureBridgeFloater() { let f = document.getElementById('bridgeFloater'); if (f) return; f = document.createElement('div'); f.id = 'bridgeFloater'; f.className = 'bridge-floater'; f.innerHTML = '<button class="bridge-entry primary" onclick="openBridgeChat()">📨 本章对话</button>'; document.body.appendChild(f); }

// ============ BRIDGE CARD (M5.3 形态B) ============
function summarizeStepOutput(step, run) {
  if (!run || !run.parsed_output) return null;
  let parsed = {};
  try { parsed = typeof run.parsed_output === 'string' ? JSON.parse(run.parsed_output) : run.parsed_output; } catch (e) { return null; }
  const fields = step?.llm_op?.output_schema?.fields || [];
  const pick = (name) => {
    const f = fields.find(item => item.name === name);
    if (!f) return null;
    const v = parsed[name];
    if (Array.isArray(v)) return v.map(it => typeof it === 'string' ? it : (it.value || it.label || JSON.stringify(it))).filter(Boolean);
    if (typeof v === 'string') return v.trim() || null;
    return v || null;
  };
  return {
    misconceptions: pick('misconceptions_cleared') || [],
    voices: pick('external_voices') || null,
    fields: Object.keys(parsed)
  };
}
function renderBridgeCard() {
  const slot = document.getElementById('bridgeCardSlot');
  if (!slot || !chapterSteps.length) { if (slot) slot.style.display = 'none'; return; }
  const submitted = chapterSteps
    .map(step => ({ step, run: currentRunByStep[step.step_id] }))
    .filter(item => item.run && item.run.status === 'submitted');
  if (!submitted.length) { slot.style.display = 'none'; return; }
  const total = chapterSteps.length;
  const metaLine = `已完成 ${submitted.length}/${total} 步`;
  slot.style.display = 'block';
  slot.innerHTML = `<div class="bridge-card">
    <div class="hd">本 章 已 完 成</div>
    <div class="ttl">我们已经了解了你的信息</div>
    <div class="meta">${metaLine}。如果需要，你可以和导师聊聊你的想法。</div>
    <button class="cta" onclick="switchTab('chat')">对话</button>
  </div>`;
}
function openBridgeChat(ctx) {
  // M5.4 三入口统一入口: CTA 仅切换 tab + 预填上下文, 不自动发消息 (§8.7)
  switchTab('chat');
  const pane = document.getElementById('chatPane');
  const contextKey = `${chapterId}::${(ctx && ctx.step) || 'chapter'}`;
  pane.dataset.bridgeStepId = (ctx && ctx.step) || '';
  if (pane.dataset.bridgePrefilled === contextKey) return;
  pane.dataset.bridgePrefilled = contextKey;
  const step = ctx && ctx.step ? chapterSteps.find(item => item.step_id === ctx.step) : null;
  const banner = document.createElement('div');
  banner.className = 'chat-msg mentor';
  banner.innerHTML = '<div class="m-av">导</div><div class="bub"></div>';
  const text = step ? `已准备 ${chapterMeta.title || chapterId} · ${step.title} 的提交结果作为上下文，请把你想聊的写下来。` : `已准备 ${chapterMeta.title || chapterId} 的已提交信息作为上下文，请把你想聊的写下来。`;
  banner.querySelector('.bub').textContent = text;
  const msgs = document.getElementById('chatMsgs');
  if (msgs) { msgs.appendChild(banner); msgs.scrollTop = msgs.scrollHeight; }
}
function openBridgeChatForStep(stepId) { openBridgeChat({ step: stepId }); }
function toggleStepGuide(button) {
  const popover = button.parentElement?.querySelector('.step-guide-popover');
  if (!popover) return;
  const open = popover.classList.toggle('open');
  button.setAttribute('aria-expanded', String(open));
}

// ============ DIRECTORY DROPDOWN ============
function buildDir() {
  const drop = document.getElementById('dirDrop');
  if (!drop) return;
  const chapters = allChapters;
  const curId = chapterId;
  const h2s = [];
  const book = document.getElementById('bookContent');
  if (book) book.querySelectorAll('h2').forEach((h, i) => h2s.push({ text: h.textContent.trim(), i }));
  drop.innerHTML = `
    <div class="grp">全 部 卷 章</div>

async function loadSummary() {
  const pane = document.getElementById('summaryPane');
  if (!pane) return;
  pane.innerHTML = `<div class="pane-pad no-content">加载摘要…</div>`;
  try {
    const body = await load(`/api/chapters/${chapterId}/summary`);

    }

  } catch (e) {

  }

function renderSummary(s) {
  const pane = document.getElementById('summaryPane');

  };

  pane.innerHTML = `

async function generateSummary() {

function renderChatMsgs(list) {
  const msgs = document.getElementById('chatMsgs');

  if (!list.length) { msgs.innerHTML = '<div class="no-content">开始与导师对话吧</div>'; return; }
  msgs.innerHTML = list.map(m => {
    const safe = document.createElement('div');
    safe.textContent = m.content;

      <div class="bub"></div>
    </div>`;
  }).join('');

  });

async function sendChat() {
  const ta = document.getElementById('chatInput');
  const content = (ta ? ta.value : '').trim();
  if (!content) return;
  const msgs = document.getElementById('chatMsgs');
  // Optimistic user bubble — use textContent to avoid XSS
  const userRow = document.createElement('div');
  userRow.className = 'chat-msg user';
  userRow.innerHTML = '<div class="m-av">你</div><div class="bub"></div>';
  userRow.querySelector('.bub').textContent = content;
  msgs.appendChild(userRow);
  ta.value = '';
  msgs.scrollTop = msgs.scrollHeight;
  const sendBtn = document.querySelector('.chat-input button');
  if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = '导师思考中…'; }
  try {
    const body = await fetchJson(`${API}/api/chapters/${chapterId}/chat/send`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content, step_id: document.getElementById('chatPane')?.dataset.bridgeStepId || null }),
    }, { timeout: 180000, retry: 0 });

    const mentorRow = document.createElement('div');

    mentorRow.querySelector('.bub').textContent = body?.mentor?.content || '导师暂时没有返回内容。';
    msgs.appendChild(mentorRow);
    msgs.scrollTop = msgs.scrollHeight;

    msgs.insertAdjacentHTML('beforeend', `<div class="chat-msg mentor"><div class="m-av">导</div><div class="bub">⚠ 导师暂时无法回复：${escapeHtml(message)}</div></div>`);

const NOTE_ANCHOR_VERSION = 2;

function getBookTextNodes(root) {
  if (!root) return [];
  const nodes = [];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let node;
  while ((node = walker.nextNode())) {
    if (node.textContent) nodes.push(node);
  }
  return nodes;
}
function getCanonicalBookText(root) {
  return getBookTextNodes(root).map(node => node.textContent).join('');
}
function isInsideRoot(root, node) {
  return !!node && (node === root || root.contains(node));
}
function getRootTextOffset(root, container, offset) {
  if (!isInsideRoot(root, container)) return -1;
  const range = document.createRange();
  range.selectNodeContents(root);
  range.setEnd(container, offset);
  return range.toString().length;
}
function getSelectionAnchor(root, selection) {
  if (!selection || !selection.rangeCount) return null;
  const range = selection.getRangeAt(0);
  if (!isInsideRoot(root, range.startContainer) || !isInsideRoot(root, range.endContainer)) return null;
  const raw = range.toString();
  const text = raw.trim();
  if (text.length < 2) return null;
  const leading = raw.length - raw.trimStart().length;
  const offset = getRootTextOffset(root, range.startContainer, range.startOffset) + leading;
  if (!Number.isFinite(offset) || offset < 0) return null;
  return { text, anchor: { version: NOTE_ANCHOR_VERSION, offset, len: text.length } };
}
function parseNoteAnchor(note) {
  if (!note || !note.source_anchor) return null;
  try {
    const anchor = typeof note.source_anchor === 'string' ? JSON.parse(note.source_anchor) : note.source_anchor;
    return anchor && Number.isFinite(Number(anchor.offset)) ? {
      version: Number(anchor.version) || 1,
      offset: Number(anchor.offset),
      len: Number.isFinite(Number(anchor.len)) ? Number(anchor.len) : String(note.source_text || '').length,
    } : null;
  } catch (e) {
    return null;
  }
}
function findTextPosition(root, offset, preferNext) {
  if (!Number.isFinite(offset) || offset < 0) return null;
  const nodes = getBookTextNodes(root);
  let cursor = 0;
  for (let i = 0; i < nodes.length; i += 1) {
    const node = nodes[i];
    const length = node.textContent.length;
    const atEnd = offset === cursor + length;
    if (offset < cursor + length || (atEnd && !preferNext) || (atEnd && preferNext && i === nodes.length - 1)) {
      return { node, offset: Math.max(0, offset - cursor) };
    }
    cursor += length;
  }
  return nodes.length && offset === cursor ? { node: nodes[nodes.length - 1], offset: nodes[nodes.length - 1].textContent.length } : null;
}
function getRangeForAnchor(root, anchor) {
  if (!root || !anchor || !Number.isFinite(anchor.offset) || !Number.isFinite(anchor.len) || anchor.offset < 0 || anchor.len <= 0) return null;
  const total = getCanonicalBookText(root).length;
  if (anchor.offset + anchor.len > total) return null;
  const start = findTextPosition(root, anchor.offset, true);
  const end = findTextPosition(root, anchor.offset + anchor.len, false);
  if (!start || !end) return null;
  const range = document.createRange();
  range.setStart(start.node, start.offset);
  range.setEnd(end.node, end.offset);

}
function normalizeTextWithMap(value) {
  let normalized = '', positions = [], wasSpace = false;
  for (let i = 0; i < value.length; i += 1) {
    const isSpace = value[i].trim() === '';
    if (isSpace) {
      if (!wasSpace) { normalized += ' '; positions.push(i); }
      wasSpace = true;
    } else {
      normalized += value[i];
      positions.push(i);
      wasSpace = false;
    }
  }
  let start = 0, end = normalized.length;
  while (start < end && normalized[start] === ' ') start += 1;
  while (end > start && normalized[end - 1] === ' ') end -= 1;
  return { text: normalized.slice(start, end), positions: positions.slice(start, end) };
}
function findExactTextMatches(bookText, sourceText) {
  const matches = [];
  let from = 0;
  while (from <= bookText.length) {
    const match = bookText.indexOf(sourceText, from);
    if (match < 0) break;
    matches.push({ offset: match, len: sourceText.length });
    from = match + Math.max(1, sourceText.length);
  }

}
function findNormalizedTextMatches(bookText, sourceText) {
  const target = normalizeTextWithMap(sourceText);
  const indexedBook = normalizeTextWithMap(bookText);
  if (!target.text || !indexedBook.text) return [];
  const matches = [];
  let from = 0;
  while (from <= indexedBook.text.length) {
    const match = indexedBook.text.indexOf(target.text, from);
    if (match < 0) break;
    const start = indexedBook.positions[match];
    const last = indexedBook.positions[match + target.text.length - 1];
    if (Number.isFinite(start) && Number.isFinite(last)) matches.push({ offset: start, len: last - start + 1 });

}
function findNoteAnchor(root, note) {

  const stored = parseNoteAnchor(note);
  const bookText = getCanonicalBookText(root);
  let matches = sourceText ? findExactTextMatches(bookText, sourceText) : [];
  if (!matches.length && sourceText) matches = findNormalizedTextMatches(bookText, sourceText);
  if (matches.length) {
    const reference = stored && Number.isFinite(stored.offset) ? stored.offset : matches[0].offset;
    matches.sort((a, b) => Math.abs(a.offset - reference) - Math.abs(b.offset - reference));
    return { version: NOTE_ANCHOR_VERSION, offset: matches[0].offset, len: matches[0].len };
  }
  if (stored && stored.offset >= 0 && stored.len > 0 && stored.offset + stored.len <= bookText.length) {

}
function closeNotePreview() {

function setupSelectionNote() {

    popup.querySelector('.note-popup-src').textContent = text.slice(0, 200);

      const startLeft = popup.offsetLeft, startTop = popup.offsetTop;
      const onMove = (mv) => {
        const dx = mv.clientX - startX, dy = mv.clientY - startY;
        let nl = startLeft + dx, nt = startTop + dy;
        nl = Math.max(8, Math.min(window.innerWidth - popup.offsetWidth - 8, nl));
        nt = Math.max(8, Math.min(window.innerHeight - popup.offsetHeight - 8, nt));

        popup.style.top = nt + 'px';

      const onUp = () => {

        document.removeEventListener('mouseup', onUp);

/* ---------- annotation highlights: wrap selected text in <mark> ---------- */
function clearNoteMarks(root) {
  if (!root) return;
  let mark;
  while ((mark = root.querySelector('mark.note-mark'))) {
    const parent = mark.parentNode;
    if (!parent) break;
    while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
    parent.removeChild(mark);
  }
}
function createNoteMark(noteId) {
  const mark = document.createElement('mark');
  mark.className = 'note-mark';
  mark.dataset.noteId = noteId;
  return mark;
}
function wrapTextInMark(root, offset, len, noteId) {
  const range = getRangeForAnchor(root, { offset, len });
  if (!range || range.collapsed) return false;
  try {
    range.surroundContents(createNoteMark(noteId));
    return true;
  } catch (e) {
    const nodes = getBookTextNodes(root);
    const end = offset + len;
    let cursor = 0, wrapped = false;
    nodes.forEach(node => {
      const nodeStart = cursor, nodeEnd = cursor + node.textContent.length;
      const localStart = Math.max(0, offset - nodeStart);
      const localEnd = Math.min(node.textContent.length, end - nodeStart);
      if (localStart < localEnd && nodeEnd > offset && nodeStart < end) {
        const part = document.createRange();
        part.setStart(node, localStart);
        part.setEnd(node, localEnd);
        try { part.surroundContents(createNoteMark(noteId)); wrapped = true; } catch (ignored) {}
      }
      cursor = nodeEnd;
    });
    return wrapped;
  }
}
function applyAllNoteHighlights(notes) {
  const book = document.getElementById('bookContent');
  if (!book) return;
  clearNoteMarks(book);
  for (const note of notes) {
    if (note.note_type !== 'selection') continue;
    const anchor = findNoteAnchor(book, note);
    if (anchor) wrapTextInMark(book, anchor.offset, anchor.len, note.id);
  }
}
function hoverNoteMark(noteId, on) {
  const marks = document.querySelectorAll('mark.note-mark[data-note-id="' + noteId + '"]');
  marks.forEach(m => m.classList.toggle('hover', on));
}
function scrollToNoteCard(noteId) {
  const card = document.querySelector('.note-card[data-note-id="' + noteId + '"]');
  if (!card) return;
  const tab = Array.from(document.querySelectorAll('[data-pane]')).find(t => t.dataset.pane === 'notes');
  if (tab && !tab.classList.contains('active')) tab.click();
  setTimeout(() => {
    card.scrollIntoView({ block: 'center', behavior: 'smooth' });
    card.classList.add('note-flash');
    setTimeout(() => card.classList.remove('note-flash'), 1500);
  }, 60);
}
async function loadNotes() {
  const list = document.getElementById('notesList');
  if (!list) return;
  const notes = await fetchNotes(chapterId);
  noteById = new Map(notes.map(note => [note.id, note]));
  if (!notes.length) {
    clearNoteMarks(document.getElementById('bookContent'));
    list.innerHTML = '<div class="pane-pad no-content">暂无笔记<br>选中文字 → 弹出笔记框</div><div class="pane-pad"><button class="gen-btn" onclick="createStandaloneNote()">+ 新建独立笔记</button></div>';
    return;
  }
  applyAllNoteHighlights(notes);
  list.innerHTML = notes.map(n => {
    return '<div class="note-card" data-note-id="' + n.id + '" onmouseenter="hoverNoteMark(\'' + n.id + '\', true)" onmouseleave="hoverNoteMark(\'' + n.id + '\', false)">' +
      '<div class="ty">' + (n.note_type === 'selection' ? '📌 选区笔记' : '✏️ 独立笔记') + '</div>' +
      (n.source_text ? '<div class="src"></div>' : '') +
      '<div class="ct"></div><div class="note-actions">' +
      (n.source_anchor ? '<button onclick="locateNote(\'' + n.id + '\')">定位原文</button>' : '') +
      '<button onclick="editNote(\'' + n.id + '\')">编辑</button><button class="del" onclick="delNote(\'' + n.id + '\')">删除</button></div></div>';
  }).join('');
  Array.from(list.querySelectorAll('.note-card')).forEach((card, i) => {
    const note = notes[i];
    if (note.source_text) card.querySelector('.src').textContent = note.source_text.slice(0, 100);
    card.querySelector('.ct').textContent = note.content;
  });
}
async function locateNote(id) {
  const notes = await fetchNotes(chapterId);
  const note = notes.find(item => item.id === id);
  if (!note || !note.source_anchor) { alert('该笔记没有原文位置信息（独立笔记）'); return; }
  const book = document.getElementById('bookContent');
  if (!book) return;
  const anchor = findNoteAnchor(book, note);
  const range = getRangeForAnchor(book, anchor);
  if (!range) { alert('未找到对应原文，章节结构或内容可能已变更'); return; }
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  const target = range.startContainer.nodeType === Node.TEXT_NODE ? range.startContainer.parentElement : range.startContainer;
  if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  const flash = target && (target.closest('p, h1, h2, h3, h4, li, blockquote') || target);
  if (flash) {
    flash.classList.add('hl-flash');
    flash.style.background = '#f5deb3';
    setTimeout(() => { flash.style.background = ''; flash.classList.remove('hl-flash'); }, 2000);
  }
}

  await updateNote(id, newContent.trim());
  loadNotes();
}

}
async function createStandaloneNote() {

async function confirmCh03Step(stepId, btn) {
  const current = currentRunByStep[stepId];
  if (!current || current.status !== 'saved') return;
  const output = ch03CollectEditedOutput(stepId);
  const errors = [];
  ['importance', 'talents', 'likes'].forEach(field => {
    const values = output[field] || [];
    if (values.length < 3 || values.length > 5 || values.some(value => !value)) errors.push(`${field} 需要填写 3–5 项且不能为空`);
  });
  if (errors.length) { alert(errors.join('\n')); return; }
  if (btn) { btn.disabled = true; btn.textContent = '保存并提交中…'; }
  try {
    await fetchJson(`${API}/api/chapters/${chapterId}/steps/${stepId}/output`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({parsed_output: output}) });
    await fetchJson(`${API}/api/chapters/${chapterId}/steps/${stepId}/submit`, { method: 'POST' });
    ch03StageByStep[stepId] = 4;
    await loadCurrentRuns(); renderStepList(); toggleStep(stepId); renderBridgeCard();

    </div>`);
  }
  if (sections.length) return sections.join('');
  if (!parsed.groups && !parsed.conversions) {
    const declared = renderDeclaredOutputFields(parsed, step);
    if (declared) return declared;
  }
  if (Array.isArray(parsed.keywords)) {
    const f = step?.llm_op?.output_schema?.fields?.find(x => x.name === 'keywords');
    return renderEditableList(parsed.keywords, 'keywords', !!f?.readonly);
  }
  if (Array.isArray(parsed.ranked)) {
    const f = step?.llm_op?.output_schema?.fields?.find(x => x.name === 'ranked');
    return renderEditableList(parsed.ranked, 'ranked', !!f?.readonly);
  }
  // Intersection field semantics differ per chapter (per design review 2026-08-04):
  //   - ch03: LLM-derived, readonly summary (user cannot edit)
  //   - ch07: user-editable 组合矩阵 (editable)
  if (Array.isArray(parsed.intersection)) {
    const isCh03Matrix = chapterId === 'ch03';
    return renderEditableList(parsed.intersection, 'intersection', isCh03Matrix);
  }
  if (parsed.comments && parsed.improvements) {
    return `<div class="llm-out"><div class="lb">元反思</div><ol style="margin:6px 0;padding-left:20px">${parsed.comments.map(c => `<li>${c}</li>`).join('')}</ol><div style="margin-top:8px"><strong>改进建议：</strong>${parsed.improvements}</div></div>`;
  }
  if (parsed.work_purpose || parsed.reasoning || Array.isArray(parsed.experience_map)) {
    const purposeSections = [];
    if (parsed.work_purpose) purposeSections.push(`<div class="llm-out"><div class="lb">工作目的</div><div class="out-value">${renderMarkdown(String(parsed.work_purpose))}</div></div>`);
    if (parsed.reasoning) purposeSections.push(`<div class="llm-out"><div class="lb">推理过程</div><div class="out-value">${renderMarkdown(String(parsed.reasoning))}</div></div>`);
    if (Array.isArray(parsed.experience_map) && parsed.experience_map.length) purposeSections.push(renderOutputTable(parsed.experience_map, '经历映射'));
    return purposeSections.join('');
  }

  // M5.2: ch04 step-2 groups (umbrella + keywords + locked)
  if (Array.isArray(parsed.groups) && parsed.groups.length) {
    const groupsHtml = parsed.groups.map((g, gi) => {
      const lock = g.locked ? '<span class="lock-ind">🔒</span>' : '';
      const umbrella = escapeHtml(g.umbrella || '');
      const kws = Array.isArray(g.keywords)
        ? g.keywords.map(k => `<span class="kw-chip">${escapeHtml(typeof k === 'string' ? k : (k && (k.value || JSON.stringify(k)) || ''))}</span>`).join('')
        : '';
      return '<div class="grp-card" data-idx="' + gi + '">'
        + '<div class="grp-umbrella">' + lock + '<strong>' + umbrella + '</strong></div>'
        + '<div class="grp-keywords">' + kws + '</div></div>';
    }).join('');
    return '<div class="llm-out"><div class="lb">思维导图 (' + parsed.groups.length + ')</div><div class="grp-list">' + groupsHtml + '</div></div>';
  }

  // M5.2: ch04 step-3 conversions (value + type + converted_to + why_chain)
  if (Array.isArray(parsed.conversions) && parsed.conversions.length) {
    const convsHtml = parsed.conversions.map((c, ci) => {
      const typeLabel = c.type === 'self' ? '自我（可控）' : c.type === 'other' ? '他人（不可控）' : '';
      const target = c.converted_to ?? c.rewritten ?? '';
      const targetText = target || (c.type === 'self' ? '保留为自我中心价值观' : '待转化');
      const why = Array.isArray(c.why_chain) ? c.why_chain : [];
      const whyHtml = why.length ? `<ol class="why-chain">${why.map(item => `<li>${escapeHtml(String(item))}</li>`).join('')}</ol>` : '';
      return '<div class="conv-row" data-idx="' + ci + '">'
        + (typeLabel ? '<span class="conv-type">' + escapeHtml(typeLabel) + '</span>' : '')
        + '<span class="conv-from">' + escapeHtml(c.value || '') + '</span>'
        + '<span class="conv-arrow">→</span>'
        + '<span class="conv-to">' + escapeHtml(targetText) + '</span>'
        + whyHtml + '</div>';
    }).join('');
    return '<div class="llm-out"><div class="lb">以我为中心转化 (' + parsed.conversions.length + ')</div><div class="conv-list">' + convsHtml + '</div></div>';
  }

  return '<div class="llm-out"><div class="lb">LLM 输出</div><pre style="white-space:pre-wrap;font-size:11px">' + JSON.stringify(parsed, null, 2) + '</pre></div>';
}
function renderEditableList(items, fieldName, readonly = false, label = null) {
  const normalized = items.map(k => typeof k === 'string' ? { value: k, locked: false } : k);
  const chips = normalized.map((k, i) => {
    const rank = i + 1;
    const xHtml = readonly ? '' : `<span class="x" onclick="event.stopPropagation();deleteChip(this)" title="删除">×</span>`;
    // readonly (pure-sort) keeps ▲▼ reorder arrows; editable: chip-click toggles lock, × deletes
    const reorderHtml = readonly
      ? `<span class="reorder" onclick="event.stopPropagation();moveChip(this,-1)" title="上移">▲</span>`
      : '';
    const reorderHtml2 = readonly
      ? `<span class="reorder" onclick="event.stopPropagation();moveChip(this,1)" title="下移">▼</span>`
      : '';
    // Lock indicator is purely visual; click handler on the whole chip toggles lock
    const lockInd = k.locked ? '<span class="lock-ind">🔒</span>' : '';
    const chipOnClick = readonly ? '' : 'toggleChipLock(this)';
    return `<span class="chip${k.locked && !readonly ? ' locked' : ''}" data-field="${fieldName}" data-idx="${i}" onclick="${chipOnClick}" title="${k.value}">
      ${reorderHtml}<span class="rk">${rank}</span>${lockInd}<span class="cv">${k.value}</span>${xHtml}${reorderHtml2}</span>`;
  }).join('');
  const addHtml = readonly ? '' : `<span class="chip add" data-field="${fieldName}" onclick="addChip(this)">＋ 添加</span>`;
  const lb = label || (readonly ? '关键词排序 · 点击 ▲▼ 调整顺序' : '关键词 · 点击 chip 锁定 · × 删除');
  return `<div class="llm-out"><div class="lb">${lb}</div>
    <div class="chip-row" id="chipList-${fieldName}" data-field="${fieldName}">${chips}${addHtml}</div></div>`;
}
async function moveChip(xEl, dir) {
  const chip = xEl.closest('.chip');
  const list = chip.parentElement;
  const idx = Array.from(list.children).indexOf(chip);
  const target = idx + dir;
  if (target < 0 || target >= list.children.length) return;
  if (dir > 0) list.insertBefore(chip, list.children[target + 1]);
  else list.insertBefore(chip, list.children[target]);
  // re-index ranks in place
  Array.from(list.querySelectorAll('.chip')).forEach((c, i) => {
    const rk = c.querySelector('.rk'); if (rk) rk.textContent = i + 1;
  });
  await saveChipEdits(chip.dataset.field);
}
async function toggleChipLock(xEl) {
  xEl.closest('.chip').classList.toggle('locked');
  await saveChipEdits(xEl.closest('.chip').dataset.field);
}
async function deleteChip(xEl) {
  const chip = xEl.closest('.chip');
  if (chip.classList.contains('locked')) { alert('锁定项不能删除'); return; }
  chip.remove();
  await saveChipEdits(chip.dataset.field);
}
async function addChip(el) {
  const field = el.dataset.field;
  const text = prompt('新关键词：');
  if (!text || !text.trim()) return;
  const list = document.getElementById(`chipList-${field}`);
  const newChip = document.createElement('span');
  newChip.className = 'chip'; newChip.dataset.field = field;
  newChip.title = text.trim();
  newChip.onclick = () => toggleChipLock(newChip);
  newChip.innerHTML = `<span class="rk">${list.children.length}</span><span class="cv">${text.trim()}</span><span class="x" onclick="event.stopPropagation();deleteChip(this)" title="删除">×</span>`;
  list.insertBefore(newChip, list.querySelector('.chip.add'));
  await saveChipEdits(field);
}
async function saveChipEdits(field) {
  const list = document.getElementById(`chipList-${field}`);
  if (!list) return;
  const items = Array.from(list.querySelectorAll('.chip:not(.add)')).map(el => ({
    value: el.textContent.replace(/[🔒×＋▲▼]/g, '').trim().replace(/^\d+/, '').trim(),
    locked: el.classList.contains('locked'),
  }));
  const card = list.closest('.st-card');
  const stepId = card ? card.dataset.step : null;
  if (!stepId) return;
  const cur = currentRunByStep[stepId];
  const parsed = cur?.parsed_output ? JSON.parse(cur.parsed_output) : {};
  parsed[field] = items;
  await fetchJson(`${API}/api/chapters/${chapterId}/steps/${stepId}/output`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ parsed_output: parsed }),
  });
  if (cur) cur.parsed_output = JSON.stringify(parsed);
}
async function saveDraft(stepId, newRun = false) {
  const step = chapterSteps.find(s => s.step_id === stepId);
  const answers = collectStepAnswers(step);
  await fetchJson(`${API}/api/chapters/${chapterId}/steps/${stepId}/draft`, {

  });

async function runStep(stepId, btn) {
  const step = chapterSteps.find(s => s.step_id === stepId);
  const answers = collectStepAnswers(step);
  const roleId = step.llm_op?.role_id || null;
  const isEditableList = step.llm_op?.output_schema?.type === 'editable_list';
  let preserve_output = chapterId === 'ch04' ? ch04BuildPreserveOutput(stepId) : null;
  if (chapterId === 'ch05') {
    const current = currentRunByStep[stepId], parsed = ch05Output(current);
    if (Array.isArray(parsed.talents)) preserve_output = { talents: parsed.talents };
  }
  if (chapterId === 'ch06' && stepId === 'step-2') {
    const current = currentRunByStep[stepId], parsed = ch06Output(current);
    if (Array.isArray(parsed.likes)) preserve_output = { likes: parsed.likes };
  }
  if (isEditableList && chapterId !== 'ch04') {
    const fieldMeta = extractListField(step);
    const cur = currentRunByStep[stepId];
    if (cur?.parsed_output) {
      try {
        const parsed = JSON.parse(cur.parsed_output);
        if (Array.isArray(parsed[fieldMeta.name])) preserve_output = { [fieldMeta.name]: parsed[fieldMeta.name] };
      } catch (e) {}
    }
  }
  if (btn) { btn.disabled = true; const t = btn.textContent; btn.textContent = '运行中…'; }
  try {
    const body = { user_answers: answers, role_id: roleId };
    if (preserve_output) body.preserve_output = preserve_output;
    await fetchJson(`${API}/api/chapters/${chapterId}/steps/${stepId}/run`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    }, { timeout: 180000, retry: 0 });

    if (chapterId === 'ch03') ch03StageByStep[stepId] = 2;
    await loadCurrentRuns(); renderStepList(); toggleStep(stepId);

  if (btn) { btn.disabled = false; btn.textContent = '运行 LLM'; }

async function fetchJson(url, opts = {}, { timeout = 30000, retry = 1 } = {}) {
  /* Lightweight fetch wrapper with timeout + retry on transient failure.
     review.md P1-6: 30s default timeout. Retries on 5xx / AbortError / network errors.
     Always throws on the final attempt; never returns undefined. */
  let lastError = null;
  for (let attempt = 0; attempt <= retry; attempt++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    try {
      const r = await fetch(url, { ...opts, signal: ctrl.signal });
      if (r.status >= 500 && attempt < retry) {
        lastError = new Error(r.status + ' ' + r.statusText);
        await new Promise(s => setTimeout(s, 300 * (attempt + 1)));
        continue;
      }
      const ct = r.headers.get('content-type') || '';
      const data = ct.includes('application/json') ? await r.json() : await r.text();
      if (!r.ok) {
        const detail = data && typeof data === 'object' ? data.detail : data;
        const suffix = detail ? ': ' + (typeof detail === 'string' ? detail : JSON.stringify(detail)) : '';
        const error = new Error(r.status + ' ' + r.statusText + suffix);
        error.status = r.status;
        throw error;
      }
      return data;
    } catch (e) {
      lastError = e;
      const transient = e && (e.name === 'AbortError' || e instanceof TypeError);
      if (transient && attempt < retry) {
        await new Promise(s => setTimeout(s, 300 * (attempt + 1)));
        continue;
      }
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }
  throw lastError || new Error('fetchJson: unknown failure');
}

// Reusable modal — returns Promise<string|null>. Resolves to the textarea value on save, null on cancel.
function showPromptModal({ title, value = '', placeholder = '', saveLabel = '保存', minHeight = 240 }) {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'prompt-overlay';
    const escaped = String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    overlay.innerHTML = `<div class="prompt-modal">
      <div class="prompt-title">${title}</div>
      <textarea class="prompt-ta" placeholder="${placeholder}" style="min-height:${minHeight}px;">${escaped}</textarea>
      <div class="prompt-actions">
        <button class="prompt-cancel">取消</button>
        <button class="prompt-save">${saveLabel}</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    const ta = overlay.querySelector('.prompt-ta');
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    const finish = (v) => { overlay.remove(); resolve(v); };
    overlay.querySelector('.prompt-cancel').onclick = () => finish(null);
    overlay.querySelector('.prompt-save').onclick = () => finish(ta.value);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) finish(null); });
    overlay.querySelector('.prompt-ta').addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') finish(ta.value);
      if (e.key === 'Escape') finish(null);
    });
  });
}

  const el = document.getElementById('refs-' + roleId);
  if (!el) return;
  const payload = await load('/api/roles/' + roleId + '/refs').catch(() => ({ refs: [] }));
  const refs = Array.isArray(payload) ? payload : (payload.refs || []);
  el.textContent = refs.length ? `被 ${refs.length} 个步骤引用` : '暂无引用';
  el.title = refs.map(ref => `${ref.chapter_id}/${ref.step_id}`).join('\n');
}
function openRoleDrawer(roleId) {
  const role = roleManagementRows.find(item => item.id === roleId);
  if (!role) return;
  const drawer = document.createElement('aside');
  drawer.className = 'role-drawer'; drawer.id = 'roleDrawer';
  drawer.innerHTML = `<h2>配置角色</h2><div class="refs">${escapeHtml(role.name)} · ${escapeHtml(role.provider)}</div><label>name</label><input id="role-edit-name" value="${escapeHtml(role.name)}"><label>description</label><input id="role-edit-description" value="${escapeHtml(role.description || '')}"><label>provider</label><input id="role-edit-provider" value="${escapeHtml(role.provider)}"><label>model</label><input id="role-edit-model" value="${escapeHtml(role.model)}"><label>temperature</label><input id="role-edit-temperature" type="number" step="0.1" value="${role.temperature ?? 0.7}"><label>max_tokens</label><input id="role-edit-max" type="number" value="${role.max_tokens ?? 2000}"><label>system_prompt</label><textarea id="role-edit-prompt">${escapeHtml(role.system_prompt || '')}</textarea><div class="role-drawer-actions"><button class="primary" onclick="saveRoleDrawer('${role.id}')">保存</button><button onclick="document.getElementById('roleDrawer').remove()">取消</button></div>`;
  document.body.appendChild(drawer);
}
async function saveRoleDrawer(roleId) {
  const body = { name: document.getElementById('role-edit-name').value.trim(), description: document.getElementById('role-edit-description').value, provider: document.getElementById('role-edit-provider').value.trim(), model: document.getElementById('role-edit-model').value.trim(), temperature: Number(document.getElementById('role-edit-temperature').value), max_tokens: Number(document.getElementById('role-edit-max').value), system_prompt: document.getElementById('role-edit-prompt').value };
  const response = await fetchJson(`${API}/api/roles/${roleId}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  if (!response.ok) { alert('保存失败：' + await response.text()); return; }
  document.getElementById('roleDrawer')?.remove(); await loadRoles(); await refreshRolesPage();
}
async function previewEmptyRoles() {
  const response = await fetchJson(`${API}/api/roles/bulk-disable-empty`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({confirm:false}) });
  if (!response.ok) { alert('获取空 prompt 列表失败：' + await response.text()); return; }
  const data = await response.json(); const candidates = data.candidates || data.roles || [];
  if (!candidates.length) { alert('没有发现需要禁用的空 prompt。'); return; }
  const detail = candidates.map(role => `${role.name} · ${role.provider}\n${(role.system_prompt || '').slice(0,120) || '(空)'}`).join('\n\n');
  if (!confirm(`以下角色将被软禁用（enabled=0），不会删除 prompt：\n\n${detail}\n\n确认执行？`)) return;
  const done = await fetchJson(`${API}/api/roles/bulk-disable-empty`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({confirm:true}) });
  if (!done.ok) { alert('禁用失败：' + await done.text()); return; }
  await loadRoles(); await refreshRolesPage();
}

// ============ BOOT ============
loadRoles();
if (new URLSearchParams(location.search).get('page') === 'roles') { renderRolesPage(); } else if (chapterId) { renderReader(); } else { renderList(); }
</script>
